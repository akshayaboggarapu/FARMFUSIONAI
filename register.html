<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Farmer Registration — FarmFusion AI</title>
    <meta name="description" content="Register as a farmer on FarmFusion AI for pre-harvest crop suitability planning and post-harvest management." />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- Navigation Bar -->
    <header class="navbar">
      <div class="nav-container">
        <a href="index.html" class="brand-link">
          <div class="brand-icon">🌱</div>
          <div class="brand-text">
            <h1 data-i18n="appName">FarmFusion AI</h1>
            <p data-i18n="tagline">Smart Farming, Better Harvest, Less Waste.</p>
          </div>
        </a>

        <div class="nav-actions">
          <div class="lang-selector">
            <span style="font-size: 0.9rem;">🌐</span>
            <select class="lang-select-input" aria-label="Select Language">
              <option value="en">English</option>
              <option value="te">తెలుగు (Telugu)</option>
              <option value="hi">हिन्दी (Hindi)</option>
            </select>
          </div>

          <div id="nav-auth-links">
            <a href="login.html" class="btn btn-secondary btn-sm" data-i18n="navLogin">Login</a>
          </div>
        </div>
      </div>
    </header>

    <!-- Registration Container -->
    <main class="auth-wrapper" style="max-width: 620px;">
      <div class="auth-card">
        <div class="auth-header">
          <div style="font-size: 2.75rem; margin-bottom: 0.5rem;">🌾</div>
          <h2 data-i18n="registerTitle">Farmer Registration</h2>
          <p data-i18n="registerSubtitle">Create your farm profile to get personalized crop recommendations</p>
        </div>

        <div id="reg-error" style="display: none; background: #ffebee; color: #c62828; padding: 0.75rem; border-radius: var(--radius-sm); margin-bottom: 1.25rem; font-size: 0.88rem; font-weight: 600;"></div>

        <form id="register-form">
          <div class="form-group">
            <label for="reg-name" data-i18n="fullName">Full Name</label>
            <input type="text" id="reg-name" class="form-control" placeholder="e.g. Ramesh Kumar" required />
          </div>

          <div class="form-row">
            <div class="form-group">
              <label for="reg-mobile" data-i18n="mobileNumber">10-Digit Mobile Number</label>
              <input type="tel" id="reg-mobile" class="form-control" placeholder="e.g. 9876543210" pattern="[0-9]{10}" required />
            </div>

            <div class="form-group">
              <label for="reg-email" data-i18n="emailOptional">Email Address (Optional)</label>
              <input type="email" id="reg-email" class="form-control" placeholder="farmer@example.com" />
            </div>
          </div>

          <div class="form-group">
            <label for="reg-password" data-i18n="password">Password</label>
            <input type="password" id="reg-password" class="form-control" placeholder="At least 6 characters" minlength="6" required />
          </div>

          <div class="form-row">
            <div class="form-group">
              <label for="reg-state" data-i18n="state">State</label>
              <input type="text" id="reg-state" class="form-control" placeholder="e.g. Telangana, Maharashtra, Punjab" required />
            </div>

            <div class="form-group">
              <label for="reg-district" data-i18n="district">District</label>
              <input type="text" id="reg-district" class="form-control" placeholder="e.g. Warangal, Nashik, Ludhiana" required />
            </div>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label for="reg-village" data-i18n="village">Village or Location</label>
              <input type="text" id="reg-village" class="form-control" placeholder="e.g. Narsampet" required />
            </div>

            <div class="form-group">
              <label for="reg-language" data-i18n="preferredLang">Preferred Language</label>
              <select id="reg-language" class="form-control">
                <option value="en">English</option>
                <option value="te">తెలుగు (Telugu)</option>
                <option value="hi">हिन्दी (Hindi)</option>
              </select>
            </div>
          </div>

          <button type="submit" class="btn btn-primary btn-lg" style="width: 100%; margin-top: 1rem;" data-i18n="registerBtn">
            Create Farmer Account
          </button>
        </form>

        <div style="text-align: center; margin-top: 1.5rem; font-size: 0.9rem; color: var(--color-text-muted);">
          <span data-i18n="hasAccount">Already registered?</span>
          <a href="login.html" style="color: var(--color-forest-base); font-weight: 700; text-decoration: none;" data-i18n="navLogin">
            Login Here
          </a>
        </div>
      </div>
    </main>

    <!-- Footer -->
    <footer>
      <p>FarmFusion AI — Smart Farming, Better Harvest, Less Waste.</p>
    </footer>

    <script src="language.js"></script>
    <script src="script.js"></script>
  </body>
</html>
